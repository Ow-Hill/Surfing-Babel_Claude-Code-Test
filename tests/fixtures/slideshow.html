<!doctype html>
<!-- Test fixture only: a stand-in slideshow that alternates random static
     with a frame containing a shape, exposing a seed in #location. -->
<html><body>
<canvas id="c" width="640" height="416"></canvas>
<div>Location: <span id="location"></span></div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let n = 0;
function frame() {
  n++;
  const img = ctx.createImageData(640, 416);
  for (let i = 0; i < img.data.length; i += 4) {
    img.data[i] = Math.random()*256; img.data[i+1] = Math.random()*256;
    img.data[i+2] = Math.random()*256; img.data[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  if (n % 3 === 0) { ctx.fillStyle = '#c33'; ctx.beginPath(); ctx.arc(320, 208, 120, 0, 7); ctx.fill(); }
  document.getElementById('location').textContent = 'seed-' + n + (n % 3 === 0 ? '-shape' : '-static');
}
frame(); setInterval(frame, 250);
</script>
</body></html>
