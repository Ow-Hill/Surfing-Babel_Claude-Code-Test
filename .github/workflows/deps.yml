name: Check for dependency updates

# Plan item I3. numpy and Pillow are pinned: a different JPEG decoder or
# numerics can change every test statistic, and the calibration (learned on
# real frames) would no longer apply. Monthly, try the latest versions:
# if the raw statistics are unchanged and the suite passes, push the new pins
# to `deps-update` and open an issue; if the statistics changed, say so (the
# pins stay until the calibration is redone). No requests to Babelia.

on:
  schedule:
    - cron: "43 7 9 * *"          # monthly, the 9th
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"

      - name: Latest numpy and Pillow
        id: latest
        run: |
          pip install -q -r requirements-dev.txt
          pip install -q --upgrade numpy pillow
          numpy=$(python -c "import numpy; print(numpy.__version__)")
          pillow=$(python -c "import PIL; print(PIL.__version__)")
          echo "numpy=$numpy" >> "$GITHUB_OUTPUT"
          echo "pillow=$pillow" >> "$GITHUB_OUTPUT"
          if grep -qx "numpy==$numpy" requirements.txt && grep -qx "pillow==$pillow" requirements.txt; then
            echo "same=1" >> "$GITHUB_OUTPUT"; echo "already up to date"
          fi

      - uses: ./.github/actions/vision-model        # the looks test's model (cached, hash-checked)

      - name: Raw statistics unchanged, and the suite passes?
        id: check
        if: steps.latest.outputs.same != '1'
        run: |
          if python -m pytest -q tests/test_detector_regression.py -k raw_statistics; then
            echo "raw=same" >> "$GITHUB_OUTPUT"
            if python -m pytest -q --ignore=tests/test_demo_slot.py; then echo "suite=pass" >> "$GITHUB_OUTPUT"; fi
          else
            echo "raw=changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Propose the new pins
        if: steps.check.outputs.raw == 'same' && steps.check.outputs.suite == 'pass'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMPY: ${{ steps.latest.outputs.numpy }}
          PILLOW: ${{ steps.latest.outputs.pillow }}
        run: |
          sed -i "s/^numpy==.*/numpy==$NUMPY/; s/^pillow==.*/pillow==$PILLOW/" requirements.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B deps-update
          git commit -qam "Dependencies: numpy $NUMPY, Pillow $PILLOW (raw statistics unchanged)"
          git push -q -f origin deps-update
          title="Surfing Babel: dependency updates are ready"
          if [ "$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json title --jq length)" = "0" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$title" --body \
              "numpy $NUMPY and Pillow $PILLOW leave every raw test statistic unchanged on the reference frames, and the full suite passes. They are on the \`deps-update\` branch: https://github.com/${{ github.repository }}/compare/main...deps-update. Open a pull request from it to merge."
          fi

      - name: Report a change in the statistics
        if: steps.check.outputs.raw == 'changed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Surfing Babel: newer numpy or Pillow changes the test statistics"
          if [ "$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json title --jq length)" = "0" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$title" --body \
              "numpy ${{ steps.latest.outputs.numpy }} / Pillow ${{ steps.latest.outputs.pillow }} change the raw statistics on the reference frames (tests/test_detector_regression.py). The pins stay. Updating needs a recalibration on frames scored with the new versions: see the babel-detector skill."
          fi
