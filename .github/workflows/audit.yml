name: Audit the calibration

# Archives a snapshot of the site's score log (the latest 100,000 frames) on
# the log-archive branch, never overlapping the previous snapshot, and checks
# the calibration on every snapshot scanned after the calibration was fitted
# (babel_surfer/audit.py). A test that reaches 3 or 4 sigma far more often
# than static opens an issue: its finds are likely false. It makes no
# requests to Babelia.

on:
  schedule:
    - cron: "41 5 * * 0"          # weekly (Sunday); the log turns over every ~2 days
  workflow_dispatch:
    inputs:
      propose:
        description: "Propose a refit even if the audit is clean (1 = yes)"
        default: "0"

permissions:
  contents: write
  issues: write

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements.txt

      - name: The site's score log and the archive so far
        run: |
          mkdir -p site-data archive
          git fetch -q --depth=1 origin gh-pages
          for f in scores.npy stats.json calibration.json; do
            git show "FETCH_HEAD:data/$f" > "site-data/$f" || rm -f "site-data/$f"
          done
          if git fetch -q --depth=1 origin log-archive; then
            for f in $(git ls-tree --name-only FETCH_HEAD); do
              git show "FETCH_HEAD:$f" > "archive/$f"
            done
          fi

      - name: Archive and audit (and, on a surplus, fit a candidate calibration)
        env:
          PROPOSE: ${{ github.event.inputs.propose }}
        run: |
          ALWAYS=""
          if [ "$PROPOSE" = "1" ]; then ALWAYS="--always"; fi
          python -m babel_surfer.audit --archive archive --scores site-data/scores.npy \
            --stats site-data/stats.json --audit archive --data site-data --alert audit-alert.md \
            --propose candidate.json --repo "${{ github.repository }}" $ALWAYS

      - name: Save the archive (log-archive branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd archive
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b log-archive
          git add -A
          git commit -q -m "Score log archive $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" log-archive && break
            sleep $((i * 5))
          done

      - name: Push the refit proposal (a person opens and merges the PR)
        if: hashFiles('candidate.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B refit-proposal
          cp candidate.json babel_surfer/calibration.json
          git add babel_surfer/calibration.json
          git commit -q -m "Calibration refit proposed by the weekly audit"
          git push -q -f origin refit-proposal

      - name: Open an issue (once per open issue)
        if: hashFiles('audit-alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -c "import json,sys; sys.exit(0 if json.load(open('archive/audit.json')).get('status') == 'flagged' else 1)"; then
            title="Surfing Babel: the calibration audit found a surplus of high scores"
          else
            title="Surfing Babel: a calibration refit is proposed"
          fi
          open=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" \
                 --json title --jq "map(select(.title == \"$title\")) | length")
          if [ "${open:-0}" = "0" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$title" --body-file audit-alert.md
          else
            echo "an issue for this is already open"
          fi
