name: Tests

# Run the test suite on every pull request (so a PR shows a green or red
# check, also during the live demo) and on pushes to main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (unused imports, undefined names)
        run: python -m pyflakes babel_surfer tests .claude/skills
      - name: Demo slot spec
        run: python -m pytest -q tests/test_demo_slot.py
      - name: Full suite (runs even if the demo spec is red during a live demo)
        if: always()
        run: python -m pytest -q --ignore=tests/test_demo_slot.py

  # The built site in headless Chromium (tests/test_site_browser.py): loads
  # without errors, no sideways scrolling on a phone, finds and the search
  # demo work, controls are named. Skipped in the job above (no browser).
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - name: Browser tests
        run: python -m pytest -q -m browser tests/test_site_browser.py tests/test_rate.py
