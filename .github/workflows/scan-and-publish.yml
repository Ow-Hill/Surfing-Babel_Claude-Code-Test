name: Scan Babel and publish site

# Every hour: pull frames from the Babelia slideshow, classify them, and
# publish the results to GitHub Pages (served from the gh-pages branch).
# Concurrency adapts to Babelia's response time (see babel_surfer/scan.py),
# and long scans publish every 30 minutes instead of only at the end.
on:
  schedule:
    - cron: "23 * * * *"          # hourly (runs from the default branch)
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to scan (max ~330; the job limit is 6 h)"
        default: "25"
  issues:
    types: [opened]               # "I see something" flags get scored within minutes
  push:
    branches: [main]
    paths: ["babel_surfer/**", "site/**", ".github/workflows/**"]

permissions:
  contents: write
  actions: write        # for the keep-alive step
  issues: write         # for find alerts

concurrency:
  group: scan-and-publish
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'Flag')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # to see which files a push changed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install numpy pillow pytest   # pytest: the demo slot's live checklist

      - name: Check out existing site data (gh-pages)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages
            git worktree add public origin/gh-pages
          else
            mkdir -p public
            git -C public init -q
            git -C public remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - name: Scan, build and publish (every 30 minutes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MIN="${{ github.event.inputs.minutes }}"
          if [ -z "$MIN" ]; then
            case "${{ github.event_name }}" in
              push)
                MIN=1                # publish code changes fast
                # Only the demo slot, site, docs or tests changed (e.g. the live
                # demo's merge): skip scanning entirely and just republish.
                BEFORE="${{ github.event.before }}"
                if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$' && \
                   git cat-file -e "$BEFORE" 2>/dev/null; then
                  CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
                  echo "changed files:"; echo "$CHANGED"
                  if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qvE '^(babel_surfer/demo_slot\.py|site/|docs/|tests/|README\.md)'; then
                    MIN=0
                    echo "only demo/site/docs files changed: publishing without scanning"
                  fi
                fi
                ;;
              schedule) MIN=45 ;;
              issues) MIN=0 ;;     # just score the flag, rebuild and publish  # hourly: leaves time for re-scoring, build and publish
              *) MIN=25 ;;
            esac
          fi
          if [ "$MIN" -gt 330 ]; then MIN=330; fi
          CHUNK=30

          git -C public config user.name "github-actions[bot]"
          git -C public config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish() {
            # A single commit with no history, so images dropped from the site
            # don't keep growing the repository. Later chunks amend it.
            if [ "$(git -C public rev-parse --abbrev-ref HEAD 2>/dev/null)" = "publish" ]; then
              git -C public add -A
              git -C public commit -q --amend -m "Scan results $(date -u +%Y-%m-%dT%H:%MZ)" || true
            else
              git -C public checkout -q --orphan publish
              git -C public add -A
              git -C public commit -q -m "Scan results $(date -u +%Y-%m-%dT%H:%MZ)"
            fi
            for i in 1 2 3; do git -C public push -q -f origin HEAD:gh-pages && return 0; sleep $((i * 5)); done
            return 1
          }

          # frames visitors flagged ("I see something" issues): score, reply, close
          python -m babel_surfer.flags --data public/data || echo "flags step failed; continuing"

          remaining=$MIN
          while :; do
            this=$(( remaining < CHUNK ? remaining : CHUNK ))
            echo "::group::scan $this min ($remaining min left)"
            python -m babel_surfer.scan --out public/data --minutes "$this" --workers 3 --max-workers 5
            echo "::endgroup::"
            # tests still calibrated on simulated static switch to real frames once
            # the scan log has enough of them; re-score the log if that happened
            python -m babel_surfer.calibrate --refit-live public/data
            python -m babel_surfer.remine --out public/data
            python -m babel_surfer.build_site --out public
            python -m babel_surfer.alerts --data public/data --feed public/feed.xml --alert alert.md
            if [ -f alert.md ]; then
              gh issue create --repo "${{ github.repository }}" \
                --title "Surfing Babel: something reached 8σ" --body-file alert.md
              rm alert.md
            fi
            publish
            remaining=$(( remaining - this ))
            [ "$remaining" -gt 0 ] || break
          done

      # GitHub disables scheduled workflows in public repos after 60 days
      # without repository activity. Re-enabling the workflow through the API
      # resets that timer. Runs even if the scan failed; never fails the job.
      - name: Keep the schedule alive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scan-and-publish.yml/enable" \
            && echo "schedule kept alive" || echo "keep-alive call failed (non-fatal)"
