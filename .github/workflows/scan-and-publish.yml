name: Scan Babel and publish site

# Every few hours: pull frames from the Babelia slideshow, classify them,
# and publish the results to GitHub Pages (served from the gh-pages branch).
on:
  schedule:
    - cron: "23 */3 * * *"        # every 3 hours (runs from the default branch)
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to scan (max ~330; the job limit is 6 h)"
        default: "25"
  push:
    branches: [main, claude/pensive-ritchie-hc4bfy]
    paths: ["babel_surfer/**", "site/**", ".github/workflows/**"]

permissions:
  contents: write
  actions: write        # for the keep-alive step
  issues: write         # for find alerts

concurrency:
  group: scan-and-publish
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install numpy pillow

      - name: Check out existing site data (gh-pages)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages
            git worktree add public origin/gh-pages
          else
            mkdir -p public
          fi

      - name: Scan
        run: |
          MIN="${{ github.event.inputs.minutes }}"
          if [ -z "$MIN" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then MIN=5; else MIN=25; fi
          fi
          if [ "$MIN" -gt 330 ]; then MIN=330; fi
          python -m babel_surfer.scan --out public/data --minutes "$MIN" --workers 3

      - name: Build site
        run: python -m babel_surfer.build_site --out public

      - name: Alert on big finds (>= 8σ)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m babel_surfer.alerts --data public/data --feed public/feed.xml --alert alert.md
          if [ -f alert.md ]; then
            gh issue create --repo "${{ github.repository }}" \
              --title "Surfing Babel: something reached 8σ" --body-file alert.md
          fi

      - name: Publish to gh-pages
        working-directory: public
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Publish as a single fresh commit (no history) so images that were
          # dropped from the site don't keep growing the repository.
          if [ ! -d .git ] && [ ! -f .git ]; then
            git init -q
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
          git checkout -q --orphan publish
          git add -A
          git commit -q -m "Scan results $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -f origin HEAD:gh-pages && break; sleep $((i * 5)); done

      # GitHub disables scheduled workflows in public repos after 60 days
      # without repository activity. Re-enabling the workflow through the API
      # resets that timer. Runs even if the scan failed; never fails the job.
      - name: Keep the schedule alive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scan-and-publish.yml/enable" \
            && echo "schedule kept alive" || echo "keep-alive call failed (non-fatal)"
